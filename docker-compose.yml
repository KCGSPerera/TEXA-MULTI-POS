version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: texa
      POSTGRES_USER: texa
      POSTGRES_PASSWORD: texa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U texa -d texa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://texa:texa@postgres:5432/texa?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me
      MIGRATIONS_PATH: /app/migrations
      RATE_LIMIT_RPS: "10"
      RATE_LIMIT_BURST: "20"
      REFRESH_TOKEN_TTL_HOURS: "720"
      OTEL_SERVICE_NAME: texa-multi-pos-api
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
